name: Publish Expo OTA Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'server/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  publish:
    name: Publish production OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "EAS OTA update skipped: EXPO_TOKEN and EAS_PROJECT_ID are not configured in GitHub Actions." >&2
            exit 0
          fi
          eas update --branch production --message "GitHub ${GITHUB_SHA}" --non-interactive
