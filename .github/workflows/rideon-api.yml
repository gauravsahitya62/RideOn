name: RideOn API checks

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/rideon-api.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/rideon-api.yml'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Run API tests
        working-directory: server
        run: npm test
