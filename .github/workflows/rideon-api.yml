name: RideOn API checks

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/rideon-api.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/rideon-api.yml'
  workflow_dispatch:

jobs:
  api-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm ci
      - name: Run memory-path API tests
        working-directory: server
        run: npm test

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rideon
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rideon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rideon
      DATABASE_SSL: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm ci
      - name: Apply PostgreSQL migrations
        working-directory: server
        run: npm run db:migrate
      - name: Run PostgreSQL API tests
        working-directory: server
        run: npm test
