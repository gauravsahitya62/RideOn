name: Build RideOn Android App

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Android build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install EAS CLI
        run: npm install --global eas-cli
      - name: Link Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive
      - name: Build Android app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_PROFILE: ${{ inputs.profile }}
          EXPO_PUBLIC_API_URL: https://rideon-api-262g.onrender.com
          EXPO_PUBLIC_USE_LOCAL_API: "false"
        run: eas build --platform android --profile "$EAS_BUILD_PROFILE" --non-interactive --wait
      - name: Print build information
        run: eas build:list --platform android --limit 1
