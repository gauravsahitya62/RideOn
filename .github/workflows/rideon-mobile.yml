name: RideOn mobile checks

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/rideon-mobile.yml'
  pull_request:
    paths:
      - 'App.js'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/rideon-mobile.yml'
  workflow_dispatch:

jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo-doctor
      - name: Validate production Expo configuration
        env:
          NODE_ENV: production
          EAS_BUILD_PROFILE: production
          EAS_UPDATE_CHANNEL: production
          EXPO_PUBLIC_API_URL: https://production-api.invalid
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: public-validation-placeholder
          EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_KEY: public-validation-placeholder
          EXPO_PUBLIC_GOOGLE_MAPS_IOS_KEY: public-validation-placeholder
        run: npx expo config --type public
