name: RideOn mobile checks

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/rideon-mobile.yml'
  pull_request:
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/rideon-mobile.yml'
  workflow_dispatch:

jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: package.json
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
