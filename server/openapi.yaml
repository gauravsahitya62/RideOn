openapi: 3.0.3
info:
  title: RideOn API
  version: 1.0.0
  description: RideOn API contract for vehicle discovery, bookings, payments, support, delivery tracking and notifications.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: API health check
      responses:
        '200':
          description: Service is running
  /api/v1/vehicles:
    get:
      summary: List available demo fleet
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [all, car, bike] }
        - in: query
          name: city
          schema: { type: string, example: Jaipur }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Fleet listing
  /api/v1/vehicles/{id}:
    get:
      summary: Get one vehicle
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Vehicle found }
        '404': { description: Vehicle not found }
  /api/v1/bookings/quote:
    post:
      summary: Calculate demo booking estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '200': { description: Estimate calculated }
        '400': { description: Invalid request }
        '409': { description: Vehicle dates conflict with an active request }
  /api/v1/bookings:
    post:
      summary: Create a booking request (not a confirmed reservation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201': { description: Request recorded }
        '400': { description: Invalid request }
        '404': { description: Vehicle not found }
        '409': { description: Vehicle dates conflict with an active request }
  /api/v1/bookings/{id}:
    get:
      summary: Retrieve a booking request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Booking found }
        '404': { description: Booking not found }
  /api/v1/bookings/{id}/cancel:
    patch:
      summary: Cancel a requested or confirmed booking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Booking cancelled }
        '404': { description: Booking not found }
        '409': { description: Booking cannot be cancelled }
  /api/v1/notifications:
    get:
      summary: List authenticated user's notifications
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Notification page }
  /api/v1/notifications/unread-count:
    get:
      summary: Get authenticated user's unread notification count
      responses:
        '200': { description: Unread count }
  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark one owned notification read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Notification marked read }
        '404': { description: Notification not found }
  /api/v1/notifications/read-all:
    patch:
      summary: Mark all authenticated user's notifications read
      responses:
        '200': { description: Updated count }
  /api/v1/notifications/push-token:
    post:
      summary: Register an Expo push token for the authenticated device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android, web, unknown] }
                deviceId: { type: string, nullable: true }
      responses:
        '201': { description: Push token registered }
    delete:
      summary: Disable an owned Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Push token disabled }
  /api/v1/notifications/preferences:
    get:
      summary: Get authenticated user's notification preferences
      responses:
        '200': { description: Notification preferences }
    patch:
      summary: Update authenticated user's notification preferences
      responses:
        '200': { description: Updated notification preferences }

components:
  schemas:
    BookingInput:
      type: object
      required: [vehicleId, address]
      properties:
        vehicleId: { type: string, example: creta-01 }
        customerName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, pattern: '^\\+?[0-9]{10,15}$' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        startDate: { type: string, format: date, example: '2030-05-01' }
        durationDays: { type: integer, minimum: 1, maximum: 30, example: 2 }
        delivery: { type: boolean, default: true }
        address: { type: string, minLength: 8, maxLength: 300 }
        notes: { type: string, maxLength: 500 }
